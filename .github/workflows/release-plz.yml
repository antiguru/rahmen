name: Release-plz

permissions:
  pull-requests: write
  contents: write
  id-token: write

on:
  push:
    branches:
      - master

concurrency:
  group: release-plz

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    outputs:
      release_tags: ${{ steps.tags.outputs.release_tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      # Required so release-plz can verify the build during `cargo publish`.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libexiv2-dev libfontconfig1-dev python3-dev
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Run release-plz
        id: release
        uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Select Rahmen release tags
        id: tags
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
          RELEASES_CREATED: ${{ steps.release.outputs.releases_created }}
        run: |
          tags='[]'
          if [ "$RELEASES_CREATED" = true ]; then
            tags=$(jq -ce '[.[] | select(.package_name == "rahmen") | .tag] | unique' <<< "$RELEASES")
          fi
          echo "release_tags=$tags" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN-created tag pushes do not start another workflow.
  debian-release:
    needs: release-plz
    if: needs.release-plz.outputs.release_tags != '[]'
    strategy:
      matrix:
        tag: ${{ fromJSON(needs.release-plz.outputs.release_tags) }}
    uses: ./.github/workflows/deb-armhf.yml
    with:
      release_tag: ${{ matrix.tag }}
    permissions:
      contents: write
