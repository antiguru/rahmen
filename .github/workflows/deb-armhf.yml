name: Debian armhf

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ["v*", "rahmen-v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Existing Rahmen version tag to package and publish
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    steps:
      - name: Resolve checkout ref
        id: source
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          release_tag="$REQUESTED_RELEASE_TAG"
          if [ -z "$release_tag" ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            release_tag="$GITHUB_REF_NAME"
          fi
          if [ -n "$release_tag" ]; then
            if [[ ! "$release_tag" =~ ^(rahmen-)?v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
              echo "Invalid Rahmen release tag" >&2
              exit 1
            fi
            echo "ref=refs/tags/$release_tag" >> "$GITHUB_OUTPUT"
            echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ steps.source.outputs.ref }}
      - name: Validate release version
        id: version
        if: steps.source.outputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
        run: |
          python3 .github/scripts/publish_debian_release.py validate
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm
      - uses: docker/setup-buildx-action@v4
      - name: Build Debian packaging image
        uses: docker/build-push-action@v7
        with:
          context: .github/docker/deb-armhf
          platforms: linux/arm/v7
          load: true
          tags: rahmen-deb-armhf:ci
          cache-from: type=gha,scope=rahmen-deb-armhf
          cache-to: type=gha,mode=max,scope=rahmen-deb-armhf
      - name: Build and verify Debian package
        run: |
          docker run --rm --platform linux/arm/v7 \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            --env CARGO_INCREMENTAL=0 \
            --env CARGO_TARGET_DIR=/work/target/linux-armv7 \
            rahmen-deb-armhf:ci bash -euc '
              cargo deb --locked --output /work/target/debian/

              found=0
              for package in /work/target/debian/*.deb; do
                [ -f "$package" ] || continue
                found=1
                dpkg-deb --field "$package" Package Version Architecture Depends
                if [ "$(dpkg-deb --field "$package" Architecture)" != armhf ]; then
                  echo "Unexpected package architecture: $package" >&2
                  exit 1
                fi
              done
              if [ "$found" -eq 0 ]; then
                echo "No Debian package was produced" >&2
                exit 1
              fi
              cd /work/target/debian
              sha256sum -- *.deb > SHA256SUMS-trixie-armhf
            '
      - uses: actions/upload-artifact@v7
        with:
          name: rahmen-trixie-armhf
          path: |
            target/debian/*.deb
            target/debian/SHA256SUMS-trixie-armhf
          if-no-files-found: error

  publish:
    needs: package
    if: >-
      needs.package.outputs.release_tag != '' &&
      !startsWith(github.event_name, 'pull_request')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.package.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: rahmen-trixie-armhf
          path: release-assets
      - name: Publish verified Debian assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.release_tag }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 .github/scripts/publish_debian_release.py publish release-assets
