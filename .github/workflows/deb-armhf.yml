name: Debian armhf

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm
      - name: Build and verify Debian package
        run: |
          docker run --rm --platform linux/arm/v7 \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            --env CARGO_INCREMENTAL=0 \
            --env CARGO_TARGET_DIR=/work/target/linux-armv7 \
            rust:1-trixie bash -euc '
              apt-get update
              apt-get install -y --no-install-recommends \
                pkg-config dpkg-dev libexiv2-dev libfontconfig1-dev python3-dev
              cargo install cargo-deb --locked
              cargo deb --locked --output /work/target/debian/

              found=0
              for package in /work/target/debian/*.deb; do
                [ -f "$package" ] || continue
                found=1
                dpkg-deb --field "$package" Package Version Architecture Depends
                if [ "$(dpkg-deb --field "$package" Architecture)" != armhf ]; then
                  echo "Unexpected package architecture: $package" >&2
                  exit 1
                fi
              done
              if [ "$found" -eq 0 ]; then
                echo "No Debian package was produced" >&2
                exit 1
              fi
            '
      - uses: actions/upload-artifact@v7
        with:
          name: rahmen-trixie-armhf
          path: target/debian/*.deb
          if-no-files-found: error
